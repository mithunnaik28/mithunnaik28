name: Update GitHub Streak

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate streak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_streak.py

      - name: Save streak
        run: |

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add streak.svg

          git diff --cached --quiet || git commit -m "Update streak"

          git push
